<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Books</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Library Books</h1>

    <h2 id="formTitle">Add Book</h2>
    <form id="bookForm">
      <input type="text" id="title" placeholder="Title">
      <input type="text" id="author" placeholder="Author">
      <input type="number" id="year" placeholder="Year (1900 - 2026)">
      <label><input type="checkbox" id="available" checked> Available</label>
      <button type="submit" id="saveBtn">Add</button>
      <button type="button" id="cancelBtn" class="hidden">Cancel</button>
    </form>
    <p id="message"></p>

    <h2>All Books</h2>
    <div class="filter">
      <input type="text" id="searchInput" placeholder="Search by title">
      <button id="searchBtn">Search</button>
      <select id="availableFilter">
        <option value="">All</option>
        <option value="true">Available</option>
        <option value="false">Borrowed</option>
      </select>
      <button id="filterBtn">Filter</button>
      <button id="showAllBtn">Show All</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Year</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
